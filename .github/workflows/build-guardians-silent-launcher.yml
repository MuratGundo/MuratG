name: Build Guardians Silent Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-guardians-silent-launcher.yml"
      - "tools/GuardiansSilentLauncher/**"
  pull_request:
    paths:
      - ".github/workflows/build-guardians-silent-launcher.yml"
      - "tools/GuardiansSilentLauncher/**"

jobs:
  publish-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file WinExe
        shell: pwsh
        run: |
          dotnet publish `
            tools/GuardiansSilentLauncher/GuardiansSilentLauncher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish/GuardiansSilentLauncher

      - name: Prepare package
        shell: pwsh
        run: |
          $package = "package/UCREW_Guardians_TR_Sessiz"
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          Copy-Item `
            "publish/GuardiansSilentLauncher/UCREW_Guardians_TR.exe" `
            "$package/UCREW_Guardians_TR.exe"

          @"
          KURULUM

          1. UCREW_Guardians_TR.exe dosyasını Guardians.exe yanına koy.
          2. İlk çalıştırmada mevcut UCREW_Guardians_TR.zip dosyası da aynı yerde olsun.
          3. UCREW_Guardians_TR.exe dosyasını çalıştır.

          İlk çalıştırmada ZIP gizli .ucrew klasörüne taşınır.
          BAT ve PowerShell penceresi açılmaz.
          Eski BAT/PS1 yardımcıları da gizli klasöre taşınır.
          Oyun kapanınca geçici archives dosyaları otomatik temizlenir.
          "@ | Set-Content "$package/KURULUM.txt" -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UCREW-Guardians-TR-Sessiz-win-x64
          path: package/UCREW_Guardians_TR_Sessiz
          if-no-files-found: error
