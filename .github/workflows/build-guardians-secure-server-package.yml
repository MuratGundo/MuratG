name: Build Guardians Secure Server Package

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-guardians-secure-server-package.yml"
      - "server/GuardiansSecurePatch/**"
  pull_request:
    paths:
      - ".github/workflows/build-guardians-secure-server-package.yml"
      - "server/GuardiansSecurePatch/**"

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l server/GuardiansSecurePatch/secure_patch_request.php
          php -l server/GuardiansSecurePatch/secure_patch_download.php

      - name: Prepare server package
        shell: bash
        run: |
          set -euo pipefail
          package="package/UCREW_Guardians_Secure_Server"
          mkdir -p "$package/api" "$package/tools" "$package/database"

          cp server/GuardiansSecurePatch/secure_patch_request.php \
             "$package/api/secure_patch_request.php"
          cp server/GuardiansSecurePatch/secure_patch_download.php \
             "$package/api/secure_patch_download.php"
          cp server/GuardiansSecurePatch/GUARDIANS_SECURE_PACK.ps1 \
             "$package/tools/GUARDIANS_SECURE_PACK.ps1"
          cp server/GuardiansSecurePatch/GUARDIANS_SECURE_PACK.bat \
             "$package/tools/GUARDIANS_SECURE_PACK.bat"
          cp server/GuardiansSecurePatch/INSTALL_SCHEMA.sql \
             "$package/database/INSTALL_SCHEMA.sql"
          cp server/GuardiansSecurePatch/INSTALL_VPS.sh \
             "$package/INSTALL_VPS.sh"
          cp server/GuardiansSecurePatch/ucrew_guardians_server.json \
             "$package/ucrew_guardians_server.json"

          chmod +x "$package/INSTALL_VPS.sh"

          cat > "$package/KURULUM.txt" <<'EOF'
          U-CREW GUARDIANS GÜVENLİ SUNUCU PAKETİ

          HEDEF SUNUCU:
          /var/www/api.u-crew.net

          1) Paketi VPS'e yükle ve çıkar.

          2) API dosyalarını otomatik kur:
             sudo bash INSTALL_VPS.sh

             Kurulum şunları yapar:
             - PHP dosyalarını /var/www/api.u-crew.net/api içine koyar
             - /var/www/api.u-crew.net/secure_patches/guardians klasörünü oluşturur
             - www-data izinlerini ayarlar
             - PHP sözdizimini ve nginx yapılandırmasını kontrol eder

          3) database/INSTALL_SCHEMA.sql dosyasını yeni MySQL veritabanında çalıştır.
             Eski UUM/SQLite veritabanını kullanma.

          4) Panelde Guardians oyununun slug değerini "guardians" yap.

          5) Windows'ta tools/GUARDIANS_SECURE_PACK.bat dosyasını çalıştır.
             UCREW_Guardians_TR.zip dosyasını seç.
             Araç şunları oluşturur:
             - şifreli .ucrew paketi
             - guardians_secure_metadata.json
             - REGISTER_IN_DATABASE.sql

          6) .ucrew dosyasını VPS'te şuraya yükle:
             /var/www/api.u-crew.net/secure_patches/guardians/

          7) Oluşan REGISTER_IN_DATABASE.sql dosyasını yeni MySQL veritabanında çalıştır.

          8) İstemci paketindeki UCREW_Guardians_TR.exe ve version.dll dosyalarını
             oyun klasörüne koy. Kullanıcı U-CREW Launcher'a bir kez giriş yapıp
             "Beni Hatırla" seçeneğini etkinleştirmelidir.

          9) Oyunu doğrudan Guardians.exe ile başlat.

          NOT:
          - Anahtar ve IV yalnızca secure_patch_files tablosunda tutulur.
          - İndirilen paket şifreli ve Gizli + Sistem önbellekte saklanır.
          - Açık LANDb/font dosyaları yalnızca oyun çalışırken archives içine konur.
          - Mevcut çalışan istemciyi sunucu kurulmadan değiştirme.
          EOF

      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: UCREW-Guardians-Secure-Server-Package
          path: package/UCREW_Guardians_Secure_Server
          if-no-files-found: error
