name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MuratG.sln

      - name: Build
        run: dotnet build MuratG.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MuratG.sln --configuration Release --no-build
